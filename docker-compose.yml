services:
  android-emulator:
    build:
      context: .
      args:
        # 'auto' = newest stable API. Or pin a number, e.g. 36 (Android 16).
        # Default: Android 17 (API 37.0) preview. See README to pin stable.
        ANDROID_API: "${ANDROID_API:-37.0}"
        SYSTEM_IMAGE_TAG: "${SYSTEM_IMAGE_TAG:-google_apis}"
        ABI: "x86_64"
        SDK_CHANNEL: "${SDK_CHANNEL:-3}"
    image: homelab/android-emulator:${ANDROID_API:-37.0}
    container_name: android-emulator
    devices:
      - /dev/kvm
    shm_size: "2gb"
    environment:
      # AVD_NAME left unset -> entrypoint derives it from the resolved API level.
      DEVICE_PROFILE: "${DEVICE_PROFILE:-pixel_6}"
      RAM_MB: "${RAM_MB:-3072}"
      CORES: "${CORES:-2}"
      DATA_MB: "${DATA_MB:-8192}"
      GPU_MODE: "${GPU_MODE:-swiftshader_indirect}"
    ports:
      # BIND_ADDR must be your Tailscale IP (100.x.y.z) so ADB is reachable
      # ONLY over the tailnet, never from the LAN or the internet.
      - "${BIND_ADDR:-127.0.0.1}:5555:5585"   # adbd  -> adb connect host:5555
      - "${BIND_ADDR:-127.0.0.1}:5554:5584"   # telnet console (optional)
    volumes:
      - avd-data:/home/android/.android
    restart: unless-stopped
    stop_grace_period: 30s
    # ---- resource caps (outer cgroup limit) --------------------------------
    # Keep mem_limit ABOVE guest RAM_MB + ~1.3 GB QEMU/SwiftShader overhead,
    # or Docker's OOM killer will kill the emulator during boot.
    #   RAM_MB=3072 -> total ~4.3 GB, so mem_limit 4608m (4.5 GB) is safe.
    cpus: "${CPU_LIMIT:-2.0}"
    mem_limit: "${MEM_LIMIT:-4608m}"
    mem_reservation: "2g"
    pids_limit: 512
    # cpuset: "2-5"    # optional: pin to specific host cores to avoid contention

volumes:
  avd-data:
